server:
  port: 8084

spring:
  application:
    name: dashboard-service
  datasource:
    url: jdbc:clickhouse://localhost:${CLICKHOUSE_HTTP_PORT:8123}/dashboard_db
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:clickhouse}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    consumer:
      group-id: dashboard-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

dashboard:
  clickhouse:
    initialize-schema: true
  websocket:
    stats-publish-rate-ms: 5000
    stats-initial-delay-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
