server:
  port: 8082

spring:
  application:
    name: fraud-analyzer-service
  datasource:
    url: jdbc:postgresql://localhost:5433/fraud_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-analyzer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
    streams:
      application-id: fraud-streams-app
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde

management:
  endpoints:
    web:
      exposure:
        include: health,info

fraud:
  kafka:
    publish-timeout-seconds: 10
  rules:
    high-amount-threshold: 10000
    frequency-window-seconds: 60
    frequency-max-count: 3
    night-start-hour: 0
    night-end-hour: 5
    night-amount-threshold: 3000
